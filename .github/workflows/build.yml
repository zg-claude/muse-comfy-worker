name: build-workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: "build only this image (sdxl|flux), or blank for all"
        default: ""

# Slim images (Jul 25): no model weights baked - workers read models off the RunPod network
# volume at /runpod-volume. So there are just TWO images: sdxl (all SDXL/Pony/Illustrious
# endpoints) and flux (chroma/krea). No CIVITAI secret needed anymore - nothing is downloaded
# at build time.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [lustify]
    steps:
      - uses: actions/checkout@v4
      - name: Gate
        id: g
        run: |
          only="${{ github.event.inputs.only }}"
          if [ -z "$only" ] || [ "$only" = "${{ matrix.image }}" ]; then echo "run=yes" >> $GITHUB_OUTPUT; else echo "run=no" >> $GITHUB_OUTPUT; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.g.outputs.run == 'yes'
      - uses: docker/login-action@v3
        if: steps.g.outputs.run == 'yes'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.g.outputs.run == 'yes'
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: true
          tags: ghcr.io/zg-claude/muse-comfy-worker:${{ matrix.image }}
          cache-from: type=registry,ref=ghcr.io/zg-claude/muse-comfy-worker:${{ matrix.image }}-cache
          cache-to: type=registry,ref=ghcr.io/zg-claude/muse-comfy-worker:${{ matrix.image }}-cache,mode=max
          secrets: |
            civitai=${{ secrets.CIVITAI_TOKEN }}
